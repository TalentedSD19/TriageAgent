[project]
name = "triage-agent"
version = "0.1.0"
description = "Reads support emails and raises tickets in Jira or ServiceNow using the OpenAI API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imap-tools",
    "openai",
    "pydantic",
    "python-dotenv",
    "requests",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[tool.ruff]
line-length = 120
